<!-- @dsCard group="Spacing" viewport="700x200" name="Radii & borders" subtitle="2 / 12 / 20 / pill; 1px hairlines; schaduw alleen op de stack" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper)}</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-end">
  <div style="text-align:center"><div style="width:90px;height:64px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-xs)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:6px">xs 2px — tags</div></div>
  <div style="text-align:center"><div style="width:90px;height:64px;background:var(--surface-sunken);border-radius:var(--radius-md)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:6px">md 12px — beeld</div></div>
  <div style="text-align:center"><div style="width:90px;height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-stack)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:6px">lg 20px — kaart</div></div>
  <div style="text-align:center"><div style="width:120px;height:40px;background:var(--ink);border-radius:var(--radius-pill)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:6px">pill — knoppen</div></div>
</div>
</body></html>
