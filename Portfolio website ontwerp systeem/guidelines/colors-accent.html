<!-- @dsCard group="Colors" viewport="700x200" name="Accent" subtitle="Diep petrol — spaarzaam; kleine tekst altijd --accent-text" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper)}</style></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:92px"><div style="height:64px;border-radius:6px;background:var(--accent);border:1px solid var(--line)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);margin-top:6px">--accent</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3)">#1E6E64</div></div><div style="flex:1;min-width:92px"><div style="height:64px;border-radius:6px;background:var(--accent-text);border:1px solid var(--line)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);margin-top:6px">--accent-text</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3)">#15594F</div></div><div style="flex:1;min-width:92px"><div style="height:64px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--line)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);margin-top:6px">--accent-soft</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-3)">#DEEBE6</div></div></div>
<p style="margin:14px 0 0;font-size:13px;color:var(--ink-2)">Max. één accentvlak per view. <span style="color:var(--accent-text);font-weight:500">Kleine accenttekst</span> gebruikt <span style="font-family:var(--font-mono);font-size:12px">--accent-text</span> voor contrast.</p>
</body></html>
